<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Log Tracker: top screen</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* The top screen's copy of the tracker's header and profile card (see mirror.js and top.js). */
  /* The page itself never scrolls: the header, slogan and profile card stay put, and only the menu list scrolls. */
  html, body{background:transparent !important;margin:0;padding:0;height:100%;min-height:0;overflow:hidden;overflow:clip;}
  body{padding:0 !important;background-image:none !important;}
  *{-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  ::selection{background:transparent;}
  #stage{width:720px;margin:0 auto;padding:10px 0 4px;}
  #stage .brand{margin-bottom:14px;}
  #stage .profile-hero{margin-bottom:0;}
  /* Hamburger button and its menu are drawn at 70% (30% smaller) on this screen. top.js sizes the menu's
     max-height so it always fits between the button and the bottom of the screen, and the list scrolls. */
  #stage .about-top .modal-card{display:block;margin:10px auto;max-width:600px;}
  #stage .btn-hamburger{zoom:0.7;}
  #stage .dropdown-menu{zoom:0.7;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;}
  /* Start-up animation (see crt-start.js): a 4:3 CRT picture, full height, black on both sides. */
  #crt-root{display:none;position:fixed;inset:0;z-index:99999;background:#000;overflow:hidden;}
  #crt-tv{position:absolute;left:50%;top:50%;width:729px;height:410px;margin:-205px 0 0 -364.5px;transform-origin:50% 50%;}
  #crt-case{position:absolute;inset:0;border-radius:30px;background:linear-gradient(180deg,#e0b27a30 0,#0000 12%,#0000 85%,#0008 100%),linear-gradient(100deg,#7b5230,#8f6339 30%,#6e4a2b 55%,#845a35 80%,#684628);box-shadow:inset 0 3px 4px #f0c48a66,inset 0 -5px 10px #0008,inset 3px 0 5px #f0c48a22,inset -3px 0 6px #0006;}
  #crt-grain{position:absolute;inset:0;border-radius:30px;overflow:hidden;}
  #crt-grain svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.75;}
  #crt-bez{position:absolute;left:34px;top:30px;width:460px;height:350px;border-radius:22px;background:#0e0c13;box-shadow:inset 0 0 0 3px #26232e,inset 0 6px 16px #000,0 0 0 4px #3a2414,0 0 0 6px #b98a5a55;}
  #crt-scr{position:absolute;left:10px;top:10px;width:440px;height:330px;border-radius:44px/38px;overflow:hidden;background:#000;}
  #crt-side{position:absolute;left:514px;top:30px;width:170px;height:350px;border-radius:14px;background:linear-gradient(#34281f,#211a14);box-shadow:inset 0 2px 8px #000,0 0 0 3px #3a2414,0 0 0 5px #b98a5a44;}
  .crt-knob{position:absolute;top:34px;width:68px;height:68px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#0003 0 4deg,#0000 4deg 12deg),radial-gradient(circle at 35% 28%,#f2f2f6,#9a9aa6 45%,#55555f 80%);box-shadow:0 5px 10px #000b,inset 0 -3px 5px #0006,inset 0 2px 3px #fff9;}
  .crt-knob::before{content:'';position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#d6d6dc,#6a6a75);box-shadow:inset 0 2px 3px #fff8,inset 0 -2px 4px #0006;}
  .crt-knob::after{content:'';position:absolute;left:32px;top:8px;width:5px;height:24px;background:#1b1b20;border-radius:2px;transform-origin:50% 26px;}
  #crt-k1{left:12px;}#crt-k1::after{transform:rotate(30deg);}
  #crt-k2{left:90px;}#crt-k2::after{transform:rotate(-40deg);}
  .crt-gr{position:absolute;left:20px;width:130px;height:4px;background:#080706;border-radius:2px;box-shadow:0 1px 0 #ffffff14;}
  .crt-btn{position:absolute;top:262px;width:34px;height:18px;border-radius:4px;background:linear-gradient(#5a5a64,#2f2f36);box-shadow:0 2px 3px #000a,inset 0 1px 1px #fff5;}
  #crt-led{position:absolute;left:80px;top:318px;width:10px;height:10px;border-radius:50%;background:#e44;box-shadow:0 0 8px #e44;}
  #crt-s,#crt-c,#crt-wv,#crt-n,#crt-sl,#crt-vg,#crt-gl{position:absolute;inset:0;}
  #crt-s{overflow:hidden;background:#000;}
  #crt-c{background:#b8b8c4;}
  #crt-wv{overflow:hidden;}
  .crt-st{position:absolute;left:-60px;width:560px;height:8px;overflow:hidden;}
  .crt-st>div{position:absolute;left:0;width:560px;height:330px;background:#1d1a33;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f2b84b;font:bold 24px monospace;letter-spacing:2px;text-align:center;}
  .crt-st>div>div{white-space:nowrap;}
  .crt-st small{color:#5fd3b0;font-size:14px;margin-top:10px;letter-spacing:3px;}
  #crt-n{width:440px;height:330px;opacity:0;image-rendering:pixelated;filter:brightness(.55) contrast(.9);pointer-events:none;}
  #crt-b{position:absolute;left:0;right:0;height:60px;background:linear-gradient(#fff0,#fff3,#fff0);opacity:0;pointer-events:none;}
  #crt-sl{background:repeating-linear-gradient(#0000 0 2px,#0006 2px 3px);pointer-events:none;}
  #crt-vg{background:radial-gradient(ellipse at 50% 50%,#0000 55%,#000a 100%);pointer-events:none;}
  #crt-gl{background:linear-gradient(125deg,#fff3 0,#fff0 28%);pointer-events:none;}
</style>
</head>
<body>
<div id="stage" class="wrap"></div>
<script src="js/top.js"></script>
<script src="js/crt-start.js"></script>
</body>
</html>
