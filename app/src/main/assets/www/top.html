<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Log Tracker: top screen</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* The top screen's copy of the tracker's header and profile card (see mirror.js and top.js). */
  /* The page itself never scrolls: the header, slogan and profile card stay put, and only the menu list scrolls. */
  html, body{background:transparent !important;margin:0;padding:0;height:100%;min-height:0;overflow:hidden;overflow:clip;}
  body{padding:0 !important;background-image:none !important;}
  *{-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  ::selection{background:transparent;}
  #stage{width:720px;margin:0 auto;padding:10px 0 4px;}
  #stage .brand{margin-bottom:14px;}
  #stage .profile-hero{margin-bottom:0;}
  /* Hamburger button and its menu are drawn at 70% (30% smaller) on this screen. top.js sizes the menu's
     max-height so it always fits between the button and the bottom of the screen, and the list scrolls. */
  #stage .btn-hamburger{zoom:0.7;}
  #stage .dropdown-menu{zoom:0.7;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;}
</style>
</head>
<body>
<div id="stage" class="wrap"></div>
<script src="js/top.js"></script>
</body>
</html>
