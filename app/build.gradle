plugins {
    id 'com.android.application'
}

// CI passes these in. Local and debug builds fall back to the defaults.
def releaseVersionName = System.getenv('VERSION_NAME') ?: '0.1'
def releaseVersionCode = (System.getenv('VERSION_CODE') ?: '1') as int
def keystorePath = System.getenv('KEYSTORE_PATH')
def updateRepo = System.getenv('GITHUB_REPOSITORY') ?: 'Gin649/Game-Log-Tracker-DS-Launcher'

android {
    namespace 'com.gin649.gltdslauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gin649.gltdslauncher'
        minSdk 30
        targetSdk 33
        versionCode releaseVersionCode
        versionName releaseVersionName

        // Name shown under the icon; the debug build overrides it (see buildTypes).
        manifestPlaceholders = [appLabel: 'Game Log Tracker DS Launcher']

        buildConfigField 'String', 'UPDATE_REPO', "\"${updateRepo}\""

        // Room writes its schema JSON here so future migrations can be tested.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Installs next to the release app instead of replacing it.
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: 'Debug Game Log Tracker DS Launcher']
        }
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    // chdman and dolphin-tool ship as libchdman.so / libdolphintool.so in jniLibs and are run as programs,
    // so they must be extracted to the app's native library folder instead of staying inside the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
