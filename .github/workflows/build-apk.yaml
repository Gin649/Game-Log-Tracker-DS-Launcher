name: Build APK

on:
  workflow_dispatch: # Enables manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refresh the bundled guides index. If GitHub can't be reached, the copy in the repo is used.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh RA guides index
        continue-on-error: true
        run: node tools/build-ra-guides-index.mjs app/src/main/assets/www/ra-guides-index.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: glt-ds-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
