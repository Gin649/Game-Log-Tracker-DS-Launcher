# Once a week, checks the Android ports list (data/ports.json) against GitHub and keeps ONE open issue,
# "Android ports check", up to date with what needs a look: ports whose repo moved, is archived, is gone or has no
# Android build any more, and new ports that are not listed yet. It fixes data/ports.json for renamed repos and flags
# removed ones ("gone": true) but never deletes an entry, so an installed port stays in its game's profile.
name: Ports check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the ports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_ports.py --update-ports --out ports-report.md
          cat ports-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save fixes to ports.json
        run: |
          if ! git diff --quiet data/ports.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ports.json
            git commit -q -m "Ports list: fix renamed repos, flag removed ones [automated]"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi

      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Android ports check"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if grep -q "Nothing needs attention" ports-report.md; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file ports-report.md
              gh issue close "$num"
            fi
          elif [ -n "$num" ]; then
            gh issue edit "$num" --body-file ports-report.md
          else
            gh issue create --title "$title" --body-file ports-report.md
          fi
