name: Generate keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if a keystore is already set up
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.KEYSTORE_BOOTSTRAP_PASSPHRASE }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error::KEYSTORE_BASE64 already exists. Not generating a second key."
            exit 1
          fi
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Create the KEYSTORE_BOOTSTRAP_PASSPHRASE secret first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and encrypt it
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_BOOTSTRAP_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          set -euo pipefail
          ALIAS=glt-release
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"

          keytool -genkeypair -keystore release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Game Log Tracker"

          B64=$(base64 -w0 release.jks)
          echo "::add-mask::$B64"

          printf 'KEYSTORE_BASE64=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$B64" "$PASS" "$ALIAS" "$PASS" > keystore-secrets.txt

          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in keystore-secrets.txt -out keystore-secrets.enc -pass env:PASSPHRASE

          # Optional: if a fine-grained PAT with "Secrets: read and write" is stored as
          # SECRETS_ADMIN_PAT, write the four secrets straight into the repo.
          if [ -n "${GH_TOKEN:-}" ]; then
            gh secret set KEYSTORE_BASE64   --repo "$GITHUB_REPOSITORY" --body "$B64"
            gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
            gh secret set KEY_ALIAS         --repo "$GITHUB_REPOSITORY" --body "$ALIAS"
            gh secret set KEY_PASSWORD      --repo "$GITHUB_REPOSITORY" --body "$PASS"
            echo "Secrets written to the repository."
          fi

          rm -f release.jks keystore-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.enc
          retention-days: 1
